[project]
name = "brain-mcp"
version = "0.1.0"
description = "Serveur MCP en lecture seule pour le cerveau d'Imran (~/CLAUDE-SHARED/brain/)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
brain-mcp = "brain_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
