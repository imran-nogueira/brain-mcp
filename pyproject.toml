[project]
name = "brain-mcp"
version = "0.1.0"
description = "Read-only MCP server exposing a personal Markdown knowledge base (projects, skills, contexts) to Claude"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
brain-mcp = "brain_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
